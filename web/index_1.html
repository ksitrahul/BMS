<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./main.css">
   
</head>
<style>

</style>
<body>

    <section>
        <div class="header">
            <h1>Student Registration Form</h1>
            <h5>Fill out the form carefully for registration</h5>
        </div>

        <form>
            <div class="fname">
                <div class="input-content">
                    <label for="stdname" class="student">
                        Student Name
                    </label>
                    <div class="input-body">
                        <input type="text" placeholder="First name">
                        <input type="text" placeholder="Middle name">
                        <input type="text" placeholder="Last name">
                    </div>
                </div>
            </div>

            <div class="birth">
                <div class="input-content1">
                    <label for="Birth" class="birth1">
                        Birth Date
                    </label>
                    <div class="input-body1">
                        <input type="date" name="dob" placeholder="Month" class="date">


                    </div>
                </div>


                <div class="input-content2">
                    <label for="Gender" class="gender">
                        Gender
                    </label>
                    <div class="input-body2">
                        <select type="text" placeholder="Please Select">
                            <option value="0"> Male </option>
                            <option value="0"> Female </option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="add">
                <div class="input-content3">
                    <label for="Address" class="add1">
                        Address
                    </label>

                    <div class="input-body3">
                        <div>
                            <input type="text" placeholder="Street Address">
                        </div>
                        <div>
                            <input type="text" placeholder="Street Address2">
                        </div>
                        <div class="city">
                            <input type="text" placeholder="city">
                            <input type="text" placeholder="State">
                        </div>
                        <div>
                            <input type="text" placeholder="zip code">
                        </div>
                    </div>

                </div>
            </div>

            <div class="mail">
                <div class="input-content1">
                    <label for="E-mail" class="E-mail">
                        Student E-mail
                    </label>

                    <div class="input-body4">
                        <div>
                            <input type="text" placeholder="ex:myname@example@com">
                        </div>

                    </div>

                </div>
                <div class="input-content3">
                    <label for="Mobile Number" class="Mobile Number">
                        Mobile Number
                    </label>
                    <div class="input-body4">
                        <input type="text" placeholder="(000)000-0000">
                    </div>
                </div>


            </div>

            <div class="mail">
                <div class="input-content3">
                    <label for="Phone Number" class="E-mail">
                        Phone Number
                    </label>

                    <div class="input-body4">
                        <div>
                            <input type="text" placeholder="(000)000-0000">
                        </div>

                    </div>

                </div>
                <div class="input-content1">
                    <label for="Work Number" class="Mobile Number">
                        Work Number
                    </label>
                    <div class="input-body4">
                        <input type="text" placeholder="(000)000-0000">
                    </div>
                </div>


            </div>

            <div class="company">

                <div class="input-content4">
                    <label for="Work Number" class="Mobile Number">
                        Company
                    </label>
                    <div class="input-body5">
                        <input type="text" placeholder="Company Name">

                    </div>

                </div>

                <div class="company">
                    <div class="input-content4">
                        <label for="Work Number" class="Mobile Number">
                            Course
                        </label>
                        <div class="input-body5">
                            <input type="text" placeholder="Course">

                        </div>

                    </div>

                </div>

                <div class="additional">


                    <div class="input-content4">
                        <label for="Work Number" class="Mobile Number">
                            Additional Comments
                        </label>


                        <div class="input-body6">
                            <textarea id="Additional" name="Additional" rows="15" cols="100">

                    </textarea>

                        </div>

                    </div>
                </div>

                <div class="footer">
                    <div class="button">
                        <button class="button1" type="button">Submit Application</button>
                        <button  class="button1" type="button">clear field </button>
                    </div>
                </div>

              
        </form> 

       
    </section>
    <script src="./head.js"></script>
</body>

</html>
