<html>
    <head>
        <title>TODO supply a title</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        
       <section class="h-100 bg-dark">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col">
        <div class="card card-registration my-4">
          <div class="row g-0">
            <div class="col-xl-6 d-none d-xl-block">
              <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/img4.webp"
                alt="Sample photo" class="img-fluid"
                style="border-top-left-radius: .25rem; border-bottom-left-radius: .25rem;" />
            </div>
             
            <div class="col-xl-6">
              <div class="card-body p-md-5 text-black">
                   <form action="custform_save" method="Post">
                  <h3 class="mb-5 text-uppercase"><b>Bank Account Registration Form</b></h3>
                   <label class="form-label" for="form3Example1m">Please specify the type of account you want to open.</label>
 <div class="row">
                  <div class="col-md-6 mb-4">
                    <div class="form-outline">
                       <select name="account_type"> <option>* Please Select *</option> <option> Checking Account</option><option> Saving Account</option><option>Certificate of Deposit</option><option> Money Market Account</option><option>IRA</option>
      </select>
                    </div>
                  </div>
                <div class="row">
                  <div class="col-md-6 mb-4">
                    <div class="form-outline">
                          <label class="form-label" for="form3Example1m">First name</label>
                          <input type="text" placeholder="First name" name="first_name" id="form3Example1m" class="form-control form-control-lg" />                 
                    </div>
                  </div>
                  <div class="col-md-6 mb-4">
                    <div class="form-outline">
 <label class="form-label" for="form3Example1n">Last name</label>
                      <input type="text" placeholder="Last name" name="last_name" id="form3Example1n" class="form-control form-control-lg" />
                    </div>
                  </div>
                </div>
 <div class="form-outline mb-4">
     <label class="form-label" for="form3Example8">Address</label>
                  <input type="text" placeholder="Address" name="address" id="form3Example8" class="form-control form-control-lg" />                
                </div>
                <div class="row">
                  <div class="col-md-6 mb-4">
                    <div class="form-outline">
                         <label class="form-label" for="form3Example1m1">City</label>
                      <input type="text"  placeholder="City" name="city" id="form3Example1m1" class="form-control form-control-lg" />  
                    </div>
                  </div>
                  <div class="col-md-6 mb-4">
                    <div class="form-outline">
                         <label class="form-label" for="form3Example1n1">State</label>
                      <input type="text" placeholder="State" name="state" id="form3Example1n1" class="form-control form-control-lg" />          
                    </div>
                  </div>
                </div>
<div class="form-outline mb-4">
     <label class="form-label" for="form3Example90">Pincode</label>
                  <input type="text" placeholder="Pincode" name="pincode"  id="form3Example90" class="form-control form-control-lg" />
                </div>
               
<div class="row">
                  <div class="col-md-6 mb-4">
                    <div class="form-outline">
                        <label class="form-label" for="form3Example1m1">Phone Number</label>
                      <input type="text" placeholder="9897*****" name="phone_no" id="form3Example1m1" class="form-control form-control-lg" />
                    </div>
                  </div>
                  <div class="col-md-6 mb-4">
                    <div class="form-outline">
                        <label class="form-label" for="form3Example1n1">Alternate Number</label>
                      <input type="text" placeholder="8383*****" name="alt_no" id="form3Example1n1" class="form-control form-control-lg" />            
                    </div>
                  </div>
                </div>
                <div class="d-md-flex justify-content-start align-items-center mb-4 py-2">

                  <h6 class="mb-0 me-4">Gender: </h6>

                  <div class="form-check form-check-inline mb-0 me-4">
                   <input type="radio"  value="Male" name="gender">      
                    <label class="form-check-label" for="femaleGender">Male</label>
                  </div>

                  <div class="form-check form-check-inline mb-0 me-4">
                     <input type="radio"  value="Female" name="gender">   
                    <label class="form-check-label" for="maleGender">Female</label>
                  </div>

                  <div class="form-check form-check-inline mb-0">
                      <input type="radio"  value="Other" name="gender">   
                    <label class="form-check-label" for="otherGender">Other</label>
                  </div>

                </div>
 <div class="row">
                  <div class="col-md-6 mb-4">
                    <div class="form-outline">
                       <label class="form-label" for="form3Example9">DOB</label><br>
                  <input type="date" name="dob" placeholder="Month" class="date">
                    </div>
                  </div>
                  <div class="col-md-6 mb-4">
                    <div class="form-outline">
                        <label class="form-label" for="form3Example9">Marital Status</label><br>
                  <select name="marital_status"><option>Married</option><option> Widowed</option><option> Separated</option><option> Divorced</option><option> Single</option></select>
                    </div>
                  </div>
                </div>
                               <div class="form-outline mb-4">
                                    <label class="form-label" for="form3Example99">Account No</label>
                  <input type="text" placeholder="786667*******" name="account_no" id="form3Example99" class="form-control form-control-lg" />
                </div>

                <div class="form-outline mb-4">
                     <label class="form-label" for="form3Example97">Customer ID</label>
                  <input type="text" placeholder="abc667****" name="cust_id" id="form3Example97" class="form-control form-control-lg" />
                </div>

                <div class="d-flex justify-content-end pt-3">
                    <button class="btn btn-dark btn-lg btn-block" type="reset">Reset All</button> &nbsp; &nbsp;
                  <button class="btn btn-dark btn-lg btn-block" type="Submit">Submit</button> 
 
                </div>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
</form>
    </body>
</html>
